<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>5G Network Intelligence Agent</title>

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <main class="container">

        <h1>5G Network Intelligence Agent</h1>

        <p class="subtitle">
            AI-assisted optimization, reliability analysis,
            and research visualization for Connected and Autonomous
            Vehicle V2I networks.
        </p>


        <textarea
            id="questionInput"
            placeholder="Example: Optimize the network for 1 Gbps with path loss exponent 3, then evaluate reliability at 15 m/s."
        ></textarea>


        <div class="mode-actions">

            <button
                id="askButton"
                class="primary-action"
            >
                AI Analysis
            </button>

            <button
                id="thesisPlotButton"
                class="secondary-action"
            >
                Research Plots
            </button>

        </div>


        <div
            id="loading"
            class="hidden"
        >
            Analyzing network...
        </div>


        <section
            id="metricsSection"
            class="hidden"
        >
            <h2>Network Results</h2>

            <div id="metricsContainer"></div>
        </section>


        <section
            id="chartsSection"
            class="hidden"
        >
            <h2>Network Analysis Charts</h2>


            <div class="chart-card">

                <canvas
                    id="trafficFlowChart"
                ></canvas>

            </div>


            <div class="chart-card">

                <canvas
                    id="bsDensityChart"
                ></canvas>

            </div>


            <div
                id="outageChartCard"
                class="chart-card hidden"
            >

                <canvas
                    id="outageChart"
                ></canvas>

            </div>

        </section>


        <section
            id="responseSection"
            class="hidden"
        >
            <h2>Agent Analysis</h2>

            <div id="responseText"></div>
        </section>

    </main>


    <!-- Chart.js must load before script.js -->
    <script
        src="https://cdn.jsdelivr.net/npm/chart.js"
    ></script>

    <script src="script.js"></script>

</body>

</html>
